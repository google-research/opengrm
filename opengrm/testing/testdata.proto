// Messages used to represent grammar testdata.

edition = "2024";

package opengrm;

import option "google/protobuf/cpp_features.proto";

option features.(pb.cpp).string_type = STRING;
option features.utf8_validation = NONE;

message Rewrite {
  // Optional comment.
  string comment = 1;

  // Grammar rules; must be at least one.
  repeated string rule = 2;

  // Input string.
  string input = 3;

  // Output strings; if omitted, expects composition failure.
  repeated string output = 4;
}

message Rewrites {
  string comment = 1;
  repeated Rewrite rewrite = 2;
}
