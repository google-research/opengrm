[build-system]
requires = ["scikit-build-core>=0.10", "Cython>=3.0.6"]
build-backend = "scikit_build_core.build"

[project]
name = "pynini"
dynamic = ["version"]
description = "Finite-state grammar compilation"
readme = "opengrm/pynini/README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kyle Gorman", email = "kbg@google.com" }]
keywords = [
    "computational linguistics",
    "morphology",
    "natural language processing",
    "speech recognition",
    "machine learning",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Other Environment",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["absl-py"]

[project.urls]
Homepage = "https://pynini.opengrm.org"
Repository = "https://github.com/google-research/opengrm"
Issues = "https://github.com/google-research/opengrm/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = []

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "opengrm/pynini/pynini.pyx"

[tool.scikit-build.cmake.define]
BUILD_SHARED_LIBS = "ON"
OPENGRM_BUILD_TESTS = "OFF"
OPENGRM_ENABLE_BAUMWELCH = "OFF"
OPENGRM_ENABLE_BIN = "OFF"
OPENGRM_ENABLE_INSTALL = "OFF"
OPENGRM_ENABLE_NGRAM = "OFF"
OPENGRM_ENABLE_PYNINI = "ON"
OPENGRM_ENABLE_SFST = "OFF"
OPENGRM_ENABLE_THRAX = "OFF"
