# See https://github.com/actions/runner-images.

name: "Bazel (x64 Linux)"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{github.workflow }}-${{github.head_ref || github.ref}}
  cancel-in-progress: ${{github.ref != 'main'}}

# This gives read-only access to the token.
permissions: read-all

jobs:
    build-and-test-x64-linux-bazel:
      runs-on: ubuntu-latest
      timeout-minutes: 45
      env:
        USE_BAZEL_VERSION: 9.0.0
      steps:
        - uses: actions/checkout@v6
        - name: Setup Bazel
          uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
          with:
            # Avoid downloading Bazel every time.
            bazelisk-cache: true
            # Store build cache per workflow.
            disk-cache: ${{github.workflow}}
            # Share repository cache between workflows.
            repository-cache: true
        - name: Check Bazelisk
          run: bazelisk --version
        - name: Build
          run: |
            bazelisk build --config=dev -c fastbuild //...
        - name: Test
          run: >-
            bazelisk test --config=dev -c fastbuild
            --test_size_filters=-enormous --test_output=errors
            //...
