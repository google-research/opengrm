# Builds, tests, and stages Pynini manylinux_2_28_x86_64 binary wheels and
# source distributions for TestPyPI and PyPI via Google OSS Exit Gate.

name: "Pynini Wheels"

on:
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Stage validated distributions to TestPyPI (main branch only)"
        type: boolean
        default: false
  release:
    types: [ published ]
  push:
    branches: [ main ]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "pyproject.toml"
      - ".dockerignore"
      - "opengrm/CMakeLists.txt"
      - "opengrm/__init__.py"
      - "opengrm/compat/**"
      - "opengrm/operators/**"
      - "opengrm/paths/**"
      - "opengrm/rewrite/**"
      - "opengrm/string/**"
      - "opengrm/pynini/**"
      - ".github/workflows/wheels.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "pyproject.toml"
      - ".dockerignore"
      - "opengrm/CMakeLists.txt"
      - "opengrm/__init__.py"
      - "opengrm/compat/**"
      - "opengrm/operators/**"
      - "opengrm/paths/**"
      - "opengrm/rewrite/**"
      - "opengrm/string/**"
      - "opengrm/pynini/**"
      - ".github/workflows/wheels.yml"

# Restricts default token permissions; individual jobs grant minimal access.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Compiles Python-independent C++ dependencies (Abseil, OpenFst, OpenGrm) once
  # and shares the BuildKit cache across shards via a run-scoped artifact.
  warmup-cpp-cache:
    name: "Warm up C++ base layer"
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'pynini-')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and export Python-independent C++ layer cache
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: opengrm/pynini/Dockerfile
          target: wheel-building-env
          push: false
          cache-to: type=local,dest=/tmp/buildx-cache,mode=max
      - name: Upload run-scoped BuildKit cache artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildx-cache-cpp-x86_64
          path: /tmp/buildx-cache
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # Builds, repairs (`auditwheel`), and runs clean-container smoke and unit
  # tests for each target Python runtime shard in parallel.
  build-and-test-wheels:
    name: "Wheel (${{ matrix.name }})"
    needs: warmup-cpp-cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cp311
            python_tag: "cp311-cp311"
          - name: cp312
            python_tag: "cp312-cp312"
          - name: cp313
            python_tag: "cp313-cp313"
          - name: cp314
            python_tag: "cp314-cp314"
          - name: cp315
            python_tag: "cp315-cp315"
          - name: pp311
            python_tag: "pp311-*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download run-scoped BuildKit cache artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: buildx-cache-cpp-x86_64
          path: /tmp/buildx-cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build, repair, and test wheel in isolated container
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: opengrm/pynini/Dockerfile
          target: export-wheels
          build-args: |
            PYTHON_TAGS=${{ matrix.python_tag }}
          cache-from: type=local,src=/tmp/buildx-cache
          outputs: type=local,dest=./wheelhouse
      - name: Upload validated wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pynini-wheel-${{ matrix.name }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  # Builds and validates the PEP 517 source distribution (`sdist`).
  build-sdist:
    name: "Source distribution (sdist)"
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'pynini-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Build and validate sdist
        run: |
          uv build --sdist
          uvx --from 'twine>=7,<8' twine check --strict dist/*.tar.gz
      - name: Upload sdist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pynini-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Collects all built wheels and the sdist, verifies manylinux tags, metadata,
  # and (for releases) exact pynini-<version> tag-to-artifact version binding.
  verify-dist:
    name: "Verify built distributions"
    needs: [build-and-test-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pkg_ver: ${{ steps.validate.outputs.pkg_ver }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pynini-*
          path: dist
          merge-multiple: true
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Validate collected distributions
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          shopt -s nullglob
          ls -lh dist/
          whls=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#whls[@]}" -ge 6
          test "${#sdists[@]}" -eq 1
          sdist_base=$(basename "${sdists[0]}")
          [[ "${sdist_base}" == pynini-*.tar.gz ]] || {
            echo "Unexpected sdist filename: ${sdist_base}" >&2
            exit 1
          }
          pkg_ver="${sdist_base#pynini-}"
          pkg_ver="${pkg_ver%.tar.gz}"
          [[ "${pkg_ver}" =~ ^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]] || {
            echo "Invalid PEP 440 package version: ${pkg_ver}" >&2
            exit 1
          }
          if [[ "${EVENT_NAME}" == "release" ]]; then
            expected_tag="pynini-${pkg_ver}"
            if [[ "${REF_TYPE}" != "tag" || "${RELEASE_TAG}" != "${expected_tag}" || "${REF_NAME}" != "${expected_tag}" ]]; then
              echo "Release ref/tag (${REF_TYPE}:${REF_NAME} / ${RELEASE_TAG}) does not match artifact version (${expected_tag})" >&2
              exit 1
            fi
          fi
          for whl in "${whls[@]}"; do
            whl_base=$(basename "${whl}")
            [[ "${whl_base}" == "pynini-${pkg_ver}-"*-manylinux_2_28_x86_64.whl ]] || {
              echo "Unexpected wheel filename/version/platform tag: ${whl_base}" >&2
              exit 1
            }
            uvx --from 'auditwheel>=6,<7' auditwheel show "${whl}"
          done
          uvx --from 'twine>=7,<8' twine check --strict dist/*
          echo "pkg_ver=${pkg_ver}" >> "${GITHUB_OUTPUT}"

  # Stages validated distributions to OSS Exit Gate for TestPyPI publication on
  # manual `workflow_dispatch` opt-in (main branch only) or `pynini-*` GitHub
  # pre-releases.
  publish-testpypi:
    name: "Publish to TestPyPI (OSS Exit Gate)"
    needs: verify-dist
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish_to_testpypi &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' &&
       github.event.action == 'published' &&
       github.event.release.prerelease &&
       github.ref_type == 'tag' &&
       startsWith(github.event.release.tag_name, 'pynini-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pynini
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pynini-*
          path: dist
          merge-multiple: true
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Clean up previous staging attempt for this version (if any)
        env:
          PKG_VER: ${{ needs.verify-dist.outputs.pkg_ver }}
        run: |
          if gcloud artifacts versions describe "${PKG_VER}" \
            --package="pynini" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="opengrm--testpypi" >/dev/null 2>&1; then
            gcloud artifacts versions delete "${PKG_VER}" \
              --package="pynini" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="opengrm--testpypi" \
              --quiet
          fi
      - name: Stage distributions to OSS Exit Gate (TestPyPI)
        run: |
          shopt -s nullglob
          dists=(dist/*.whl dist/*.tar.gz)
          test "${#dists[@]}" -ge 7
          UV_PUBLISH_USERNAME="oauth2accesstoken" \
          UV_PUBLISH_PASSWORD="$(gcloud auth print-access-token)" \
          uv publish \
            --publish-url "https://us-python.pkg.dev/oss-exit-gate-prod/opengrm--testpypi" \
            "${dists[@]}"
      - name: Upload OSS Exit Gate manifest
        env:
          PKG_VER: ${{ needs.verify-dist.outputs.pkg_ver }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os
          manifest = {
              "publish_all": False,
              "publishing_groups": [
                  {"packages": [{"name": "pynini", "version": os.environ["PKG_VER"]}]}
              ],
          }
          with open("/tmp/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          manifest_uri="gs://oss-exit-gate-prod-projects-bucket/opengrm/testpypi/manifests/manifest-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"
          gcloud storage cp /tmp/manifest.json "${manifest_uri}"
          {
            echo "Staged \`pynini==${PKG_VER}\` for OSS Exit Gate (TestPyPI)."
            echo "Manifest: \`${manifest_uri}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Stages validated distributions to OSS Exit Gate for production PyPI
  # publication when a non-prerelease `pynini-*` GitHub Release is published.
  publish-pypi:
    name: "Publish to PyPI (OSS Exit Gate)"
    needs: verify-dist
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      !github.event.release.prerelease &&
      github.ref_type == 'tag' &&
      startsWith(github.event.release.tag_name, 'pynini-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pynini
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pynini-*
          path: dist
          merge-multiple: true
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Clean up previous staging attempt for this version (if any)
        env:
          PKG_VER: ${{ needs.verify-dist.outputs.pkg_ver }}
        run: |
          if gcloud artifacts versions describe "${PKG_VER}" \
            --package="pynini" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="opengrm--pypi" >/dev/null 2>&1; then
            gcloud artifacts versions delete "${PKG_VER}" \
              --package="pynini" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="opengrm--pypi" \
              --quiet
          fi
      - name: Stage distributions to OSS Exit Gate (PyPI)
        run: |
          shopt -s nullglob
          dists=(dist/*.whl dist/*.tar.gz)
          test "${#dists[@]}" -ge 7
          UV_PUBLISH_USERNAME="oauth2accesstoken" \
          UV_PUBLISH_PASSWORD="$(gcloud auth print-access-token)" \
          uv publish \
            --publish-url "https://us-python.pkg.dev/oss-exit-gate-prod/opengrm--pypi" \
            "${dists[@]}"
      - name: Upload OSS Exit Gate manifest
        env:
          PKG_VER: ${{ needs.verify-dist.outputs.pkg_ver }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os
          manifest = {
              "publish_all": False,
              "publishing_groups": [
                  {"packages": [{"name": "pynini", "version": os.environ["PKG_VER"]}]}
              ],
          }
          with open("/tmp/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          manifest_uri="gs://oss-exit-gate-prod-projects-bucket/opengrm/pypi/manifests/manifest-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"
          gcloud storage cp /tmp/manifest.json "${manifest_uri}"
          {
            echo "Staged \`pynini==${PKG_VER}\` for OSS Exit Gate (PyPI)."
            echo "Manifest: \`${manifest_uri}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
